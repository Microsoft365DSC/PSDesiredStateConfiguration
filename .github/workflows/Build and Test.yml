name: Build and Test

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/PSDesiredStateConfiguration'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Modules
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Scope AllUsers -TrustRepository
          Install-PSResource -Name PSScriptAnalyzer -Scope AllUsers -TrustRepository

      - name: Build Module
        shell: pwsh
        run: |
          & ./Utilities/Build.ps1

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Import-Module './test/TestHarness.psm1' -Force

          $results = Invoke-TestHarness

          Write-TestHarnessSummary -Result $results -Path $env:GITHUB_STEP_SUMMARY

          if ($results.FailedCount -gt 0)
          {
              throw "{$($results.FailedCount)} Unit Test(s) Failed"
          }

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage
          path: CodeCov.xml
          if-no-files-found: warn

      - name: Run Pester Tests on Windows PowerShell
        shell: pwsh
        run: |
          & ./Utilities/Build.ps1 -Test -Edition Desktop

      - name: Run Script Analyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./M365DSC.PSDesiredStateConfiguration -Recurse -Severity Error
          if ($results)
          {
              $results | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
              throw "{$($results.Count)} Script Analyzer error(s) found"
          }
