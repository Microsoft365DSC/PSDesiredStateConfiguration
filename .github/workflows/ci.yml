name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # shell: powershell = Windows PowerShell 5.1, shell: pwsh = PowerShell 7
        shell: [pwsh, powershell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 6
        shell: pwsh
        run: |
          $modulePath = Join-Path $env:RUNNER_TEMP 'TempModules'
          if (-not (Test-Path $modulePath)) {
            $null = New-Item -Path $modulePath -ItemType Directory
          }
          Save-Module -Name Pester -MaximumVersion 6.9 -Path $modulePath -Force

      - name: Run test suites (Pester 6)
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pesterManifest = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'TempModules\Pester') -Recurse -Filter Pester.psd1 | Select-Object -First 1
          Import-Module $pesterManifest.FullName -Force
          Get-Module Pester | Format-Table Name, Version | Out-String | Write-Host

          $repo = $env:GITHUB_WORKSPACE
          $env:PSModulePath = (Join-Path $repo 'src') + [System.IO.Path]::PathSeparator +
            (Join-Path $repo 'test\TestModules') + [System.IO.Path]::PathSeparator +
            $env:PSModulePath

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = @(
            (Join-Path $repo 'test\M365DSC.PSDesiredStateConfiguration.Tests.ps1'),
            (Join-Path $repo 'test\FastHost.Tests.ps1'),
            (Join-Path $repo 'test\CacheRetention.Tests.ps1'),
            (Join-Path $repo 'test\SchemaCache.Tests.ps1')
          )
          $configuration.Run.Exit = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = Join-Path $repo 'testResults-${{ matrix.shell }}.xml'
          Invoke-Pester -Configuration $configuration

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: testResults-*.xml
          if-no-files-found: ignore

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Recurse -Severity Error
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host 'No errors found.'
